services:
  microbin:
    build: .
    image: microbin-local:latest
    container_name: microbin
    restart: unless-stopped
    ports:
      - "31245:8080"
    env_file:
      - microbin.env
    volumes:
      - ./data:/app/pasta_data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
